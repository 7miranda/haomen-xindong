<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>豪门心动计划</title>
<style>
:root{--ink:#3a2622;--cream:#f6ecd9;--teal:#2f5d5a;--teal2:#3f7a72;--tealD:#21403e;--wine:#7a2734;--wine2:#a23a48;--olive:#b4a55a;--gold:#d8a84a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#1d1517;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:800px;transform:translate(-50%,-50%) scale(var(--k,1));transform-origin:center;overflow:hidden;container-type:size;background:#c9b48c;border-radius:10px}
/* 城市 */
#world{position:absolute;inset:0 0 18% 0;overflow:hidden}
#world img.map{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:filter .8s}
#world.dusk img.map{filter:sepia(.25) saturate(1.1) brightness(.95)}
#world.night img.map{filter:brightness(.55) saturate(.9) hue-rotate(-12deg)}
.spot{position:absolute;cursor:pointer;border-radius:18px;transition:.2s}
.spot:hover{background:rgba(255,240,200,.18);box-shadow:0 0 0 3px rgba(255,236,190,.9),0 0 30px rgba(255,220,150,.8)}
.spot .tag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:5px 14px;border-radius:999px;background:var(--cream);border:2px solid var(--ink);font-weight:900;font-size:13px;white-space:nowrap;box-shadow:2px 3px 0 var(--ink);opacity:0;transition:.2s}
.spot:hover .tag,.spot.here .tag{opacity:1}
.spot.here .tag{background:var(--gold)}
.spot.closed{cursor:not-allowed}.spot.closed .tag{background:#ccc}
#quest{position:absolute;right:1.4%;top:2.4%;width:min(230px,24%);padding:12px 14px 10px;background:var(--cream);border:2px solid var(--ink);border-radius:6px 18px 6px 18px;box-shadow:3px 4px 0 var(--ink);z-index:3;transform:rotate(1.2deg)}
#quest h4{margin:0;font-size:11px;letter-spacing:2px;color:var(--wine)}
#quest h3{margin:2px 0 6px;font-size:15px}
.q{font-size:12px;margin:4px 0}
.q .t{display:flex;justify-content:space-between}
.q .b{height:6px;border-radius:6px;background:#e3d3b5;overflow:hidden;margin-top:2px}
.q .b i{display:block;height:100%;background:var(--teal2);transition:width .6s}
.q.ok{color:var(--teal)}.q.ok .b i{background:var(--gold)}
#walker{position:absolute;width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:var(--wine) center 8%/250% auto no-repeat;box-shadow:0 3px 8px rgba(0,0,0,.4);transform:translate(-50%,-50%);transition:left .9s ease-in-out,top .9s ease-in-out;z-index:2;pointer-events:none}
/* 房间 */
#room{position:absolute;left:7%;right:7%;top:4%;height:58%;z-index:4;display:none}
#room.show{display:block;animation:pop .35s cubic-bezier(.2,.9,.3,1.25)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
#roomView{position:absolute;inset:0;border-radius:26px;overflow:hidden;border:4px solid var(--cream);box-shadow:0 0 0 3px var(--ink),0 14px 30px rgba(0,0,0,.45);background:#d9c3a0}
#roomView img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#roomName{position:absolute;left:50%;top:10px;transform:translateX(-50%);padding:3px 16px;background:var(--teal);color:var(--cream);border:2px solid var(--ink);border-radius:999px;font-weight:900;font-size:13px;letter-spacing:2px;z-index:3}
.sprite{position:absolute;bottom:3%;height:80%;transform:translateX(-50%);transition:left .7s ease-in-out;filter:drop-shadow(3px 6px 0 rgba(0,0,0,.18));z-index:2}
.sprite.npc{cursor:pointer;z-index:1}
.sprite.npc:hover{filter:drop-shadow(0 0 8px #fff4c8) drop-shadow(0 0 2px #fff)}
.sprite.busy{animation:busy .6s ease-in-out infinite}
@keyframes busy{50%{transform:translateX(-50%) translateY(-2%)}}
.nametag{position:absolute;transform:translateX(-50%);padding:1px 10px;background:var(--cream);border:2px solid var(--ink);border-radius:8px;font-size:12px;font-weight:900;z-index:3;pointer-events:none}
#prog{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:220px;padding:8px 12px;background:rgba(246,236,217,.95);border:2px solid var(--ink);border-radius:12px;font-weight:800;font-size:13px;text-align:center;z-index:4;display:none}
#prog .b{height:8px;background:#e3d3b5;border-radius:8px;overflow:hidden;margin-top:5px}
#prog .b i{display:block;height:100%;width:0;background:var(--wine2)}
#acts{position:absolute;left:50%;transform:translateX(-50%);bottom:-62px;display:flex;gap:6px;padding:6px 10px;background:var(--teal);border:3px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--tealD)}
.act{position:relative;width:48px;height:48px;border-radius:11px;border:2px solid var(--ink);background:var(--cream);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.act:hover:not(.off){transform:translateY(-4px)}
.act.off{opacity:.4;cursor:not-allowed;filter:grayscale(1)}
.act.exit{background:var(--wine2)}
.tip{position:absolute;bottom:62px;left:50%;transform:translateX(-50%);width:170px;padding:8px 10px;background:var(--cream);border:2px solid var(--ink);border-radius:10px;font-size:12px;line-height:1.45;text-align:left;pointer-events:none;opacity:0;transition:.15s;z-index:9;box-shadow:2px 3px 0 var(--ink)}
.tip b{font-size:13px}.tip em{color:var(--wine);font-style:normal;font-weight:700;display:block}
.act:hover .tip{opacity:1}
/* 仪表盘 */
#dash{position:absolute;left:0;right:0;bottom:0;height:18%;background:var(--teal);border-top:4px solid var(--ink);display:flex;align-items:center;gap:1.6%;padding:0 1.6%;z-index:5;box-shadow:inset 0 6px 0 var(--teal2)}
#dial{position:relative;height:118%;aspect-ratio:1;margin-top:-4%;flex:none}
#dial svg{width:100%;height:100%;display:block}
#dial .txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--cream);font-weight:900;line-height:1.15}
#dial .txt small{font-size:11px;letter-spacing:1px;opacity:.85}
#dial .txt span{font-size:20px}
.panel{background:var(--tealD);border:2px solid var(--ink);border-radius:12px;padding:6px 10px;color:var(--cream);height:78%}
#wallet{display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:96px}
#wallet .m{font-size:17px;font-weight:900;color:var(--gold)}
#wallet .r{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--wine);text-align:center;font-weight:800}
#stats{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;align-content:center}
.st{display:grid;grid-template-columns:34px 1fr 26px;gap:6px;align-items:center;font-size:11px;font-weight:800}
.st .b{height:8px;border-radius:8px;background:#163130;overflow:hidden}
.st .b i{display:block;height:100%;transition:width .6s}
.st b{text-align:right}
#alerts{display:flex;gap:6px;align-items:center}
.al{width:40px;height:40px;border-radius:50%;border:3px solid var(--cream);background:var(--teal2);display:flex;align-items:center;justify-content:center;font-size:19px;opacity:.35}
.al.on{opacity:1;background:var(--wine2);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
#rel{min-width:170px;display:flex;flex-direction:column;justify-content:center}
#rel .row{display:flex;align-items:center;gap:6px}
#rel .head{width:30px;height:30px;border-radius:50%;border:2px solid var(--cream);background:#ddd center 6%/260% auto no-repeat;flex:none}
#rel .track{flex:1;display:flex;justify-content:space-between}
#rel .track i{width:8px;height:8px;border-radius:50%;background:#163130;border:1px solid var(--teal2)}
#rel .track i.on{background:var(--gold)}
#rel .lb{text-align:center;font-size:12px;font-weight:900;margin-top:4px;color:var(--gold)}
.pops{position:absolute;z-index:20;pointer-events:none;font-weight:900;font-size:15px;animation:fly 1.4s ease-out forwards;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
@keyframes fly{0%{transform:translateY(8px) scale(.6);opacity:0}15%{transform:none;opacity:1}100%{transform:translateY(-70px);opacity:0}}
/* 对话 */
#talk{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(29,21,23,.45)}
#talk.show{display:flex}
#talk .box{position:relative;width:min(520px,70%);padding:18px 20px 14px 20px;background:var(--teal);color:var(--cream);border:3px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 var(--tealD);animation:pop .3s}
#talk .face{position:absolute;left:50%;top:-58px;transform:translateX(-50%);width:84px;height:84px;border-radius:50%;border:4px solid var(--cream);background:#e8d8bb center 5%/260% auto no-repeat;box-shadow:0 0 0 3px var(--ink)}
#talk .who{margin-top:24px;text-align:center;font-weight:900;color:var(--gold);letter-spacing:2px}
#talk .line{margin:6px 0 10px;font-size:15px;line-height:1.65;text-align:center;min-height:48px}
#talk .fx{text-align:center;font-size:12px;color:#ffe3a3;font-weight:800;margin-bottom:6px}
#talk .btns{display:flex;flex-direction:column;gap:7px;align-items:center}
#talk button{min-width:58%;padding:8px 14px;border-radius:999px;border:2px solid var(--ink);background:var(--cream);color:var(--ink);font-weight:900;font-size:14px;cursor:pointer}
#talk button small{display:block;font-weight:600;font-size:11px;color:var(--wine)}
#talk button.ok{min-width:auto;padding:6px 22px;background:var(--gold)}
/* 过场 */
#cut{position:absolute;inset:0;z-index:12;display:none;background:var(--wine);align-items:center;justify-content:center}
#cut.show{display:flex}
#cut .frame{position:relative;width:76%;height:76%;border-radius:24px;overflow:hidden;border:4px solid var(--cream);box-shadow:0 0 0 3px var(--ink)}
#cut .frame img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cut .frame .sprite{height:92%;bottom:-4%}
#cut .bar{position:absolute;left:0;right:0;bottom:0;padding:14px 26px 16px;background:var(--teal);color:var(--cream);border-top:3px solid var(--ink);z-index:3;min-height:30%}
#cut .bar .who{color:var(--gold);font-weight:900;letter-spacing:2px;font-size:13px}
#cut .bar .line{font-size:16px;line-height:1.6;margin-top:4px}
#cut .bar .next{position:absolute;right:18px;bottom:10px;font-size:12px;opacity:.7;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
#cut .card{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;background:var(--wine);color:var(--cream);text-align:center}
#cut .card .wk{letter-spacing:8px;font-size:13px;opacity:.8}
#cut .card h1{font-size:clamp(26px,5cqw,52px);margin:8px 0 12px;letter-spacing:4px}
#cut .card .g{background:var(--cream);color:var(--ink);padding:8px 18px;border-radius:12px;border:2px solid var(--ink);font-weight:800;font-size:14px}
#cut .card .go{margin-top:16px;font-size:12px;opacity:.7;animation:blink 1.2s infinite}
.stamp{display:inline-block;margin-bottom:6px;padding:4px 12px;border:3px solid;border-radius:8px;font-weight:900;font-size:20px;transform:rotate(-6deg);animation:st .5s cubic-bezier(.3,1.6,.5,1) both}
.stamp.ok{color:#8fd19e;border-color:#8fd19e}.stamp.ng{color:#ffb4b4;border-color:#ffb4b4}
@keyframes st{from{transform:rotate(-6deg) scale(3);opacity:0}}
/* ================= 现代奢华主题：中性冷调黑玻璃 + 单一香槟金点缀 ================= */
:root{--g:rgba(14,15,20,.52);--g2:rgba(14,15,20,.72);--hair:rgba(255,255,255,.14);--txt:#f5f3ef;--sub:rgba(245,243,239,.58);--gold:#d9bf8c;--gold2:#b89a63;--ok:#a9d8c4;--warn:#f0a3a3}
html,body{font-family:"SF Pro Display",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.2px}
#stage{background:#0e0f14}
#world{inset:0}
.glass2,#quest,#dash,#acts,#roomName,#talk .box,#cut .bar,#cut .card .g,.nametag,#prog,.spot .tag{background:var(--g);-webkit-backdrop-filter:blur(22px) saturate(.55) brightness(.85);backdrop-filter:blur(22px) saturate(.55) brightness(.85);border:1px solid var(--hair);box-shadow:0 20px 50px rgba(0,0,0,.35);color:var(--txt)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}
/* 地图热点 */
.spot:hover{background:rgba(255,255,255,.06);box-shadow:0 0 0 1px rgba(255,255,255,.7),0 0 60px rgba(255,255,255,.35)}
.spot .tag{opacity:1;top:34%;bottom:auto;transform:translateX(-50%);border-radius:999px;padding:7px 16px 7px 12px;font-size:12px;font-weight:500;letter-spacing:2px;display:flex;align-items:center;gap:8px;transition:.25s}
.spot .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.spot:hover .tag{background:var(--g2);transform:translateX(-50%) translateY(-3px)}
.spot.here .tag{border-color:rgba(217,191,140,.6)}
.spot.closed .tag{color:var(--sub)}.spot.closed .tag::before{background:#777;box-shadow:none}
#walker{border:2px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.45),0 0 0 5px rgba(255,255,255,.18)}
/* 任务卡 */
#quest{transform:translateX(-50%);left:50%;right:auto;top:2.4%;border-radius:18px;padding:14px 18px 12px;z-index:6;width:240px}
#quest h4{color:var(--gold);font-weight:500;font-size:10px;letter-spacing:3px}
#quest h3{color:var(--txt);font-size:16px;font-weight:600;margin:3px 0 8px}
.q{color:var(--sub);font-size:12px}.q .t span:last-child{color:var(--txt);font-variant-numeric:tabular-nums}
.q .b{background:rgba(255,255,255,.1);height:2px;border-radius:2px}
.q .b i{background:var(--txt)}
.q.ok{color:var(--gold)}.q.ok .b i{background:var(--gold)}
/* 底部仪表盘 */
#dash{left:2%;right:2%;bottom:2.2%;height:13%;border-radius:22px;gap:14px;padding:0 18px;border-top:1px solid var(--hair)}
#dash .panel{background:transparent;border:0;border-left:1px solid var(--hair);border-radius:0;box-shadow:none;color:var(--txt);height:64%;padding:0 0 0 16px}
#dial{height:118%;margin-top:-10%}
#dial .txt{color:var(--txt)}
#dial .txt span{font-weight:300;font-size:22px;letter-spacing:1px}
#dial .txt small{font-size:10px;letter-spacing:1.5px;color:var(--sub)}
#wallet{min-width:110px}
#wallet .m{color:var(--txt);font-weight:300;font-size:20px;font-variant-numeric:tabular-nums}
#wallet .r{background:transparent;color:var(--gold);border:1px solid rgba(217,191,140,.5);font-weight:500;font-size:10px;letter-spacing:2px;padding:2px 10px}
#wallet [data-st="gifts"]{color:var(--sub);font-weight:400!important}
.st{color:var(--sub);font-weight:400;font-size:11px;letter-spacing:1px}.st b{color:var(--txt);font-weight:500;font-variant-numeric:tabular-nums}
.st .b{background:rgba(255,255,255,.1);height:3px;border-radius:3px}
.st .b i{background:var(--txt)!important}
#alerts{gap:10px}
.al{width:34px;height:34px;border:1px solid var(--hair);background:transparent;opacity:.35;color:var(--txt);font-size:0}
.al svg.i{width:16px;height:16px}
.al.on{opacity:1;background:rgba(240,163,163,.18);border-color:var(--warn);color:var(--warn);animation:pulse 1.6s infinite}
#rel{min-width:190px}
#rel .head{border:1px solid rgba(255,255,255,.6);width:32px;height:32px}
#rel .track i{width:6px;height:6px;background:rgba(255,255,255,.18);border:0}
#rel .track i.on{background:var(--gold);box-shadow:0 0 6px rgba(217,191,140,.8)}
#rel .lb{color:var(--gold);font-weight:500;font-size:11px;letter-spacing:2px}
/* 房间 */
#room{top:3%;height:61%}
#roomView{border:1px solid rgba(255,255,255,.35);border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
#roomName{left:16px;top:14px;transform:none;font-weight:600;font-size:13px;letter-spacing:3px;padding:6px 14px}
#roomName span{color:var(--sub);letter-spacing:.5px!important}
.nametag{border-radius:999px;padding:3px 12px;font-weight:500;font-size:11px;letter-spacing:2px}
#acts{bottom:-80px;border-radius:20px;padding:8px;gap:6px}
.act{width:auto;height:auto;min-width:84px;padding:10px 12px 8px;flex-direction:column;gap:4px;border-radius:14px;border:1px solid transparent;background:transparent;color:var(--txt);box-shadow:none;transition:background .2s,border-color .2s,transform .2s}
.act svg.i{width:22px;height:22px;color:var(--gold)}
.act .an{font-size:12px;font-weight:500;letter-spacing:1px;white-space:nowrap}
.act .ac{font-size:10px;color:var(--sub);white-space:nowrap}
.act:hover:not(.off){background:rgba(255,255,255,.08);border-color:var(--hair);transform:translateY(-3px)}
.act:active:not(.off){transform:scale(.97)}
.act.off{opacity:.32;filter:none}
.act.exit svg.i{color:var(--txt)}
.act.exit{border-left:1px solid var(--hair);border-radius:0 14px 14px 0;background:transparent}
.tip{display:none}
#prog{border-radius:14px;font-weight:500;letter-spacing:1px}
#prog .b{background:rgba(255,255,255,.12);height:3px}#prog .b i{background:var(--gold)}
/* 对话 */
#talk{background:rgba(5,6,10,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#talk .box{border-radius:26px;background:var(--g2);padding:22px 26px 18px}
#talk .face{border:2px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.4);background-color:#2a2a30}
#talk .who{color:var(--gold);font-weight:500;font-size:12px;letter-spacing:4px}
#talk .line{color:var(--txt);font-size:16px;font-weight:400;line-height:1.75}
#talk .fx{color:var(--ok);font-weight:500;letter-spacing:.5px}
#talk button{background:transparent;border:1px solid var(--hair);color:var(--txt);box-shadow:none;font-weight:500;transition:.2s}
#talk button:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.35)}
#talk button.ok{background:var(--gold);border-color:var(--gold);color:#1a1712;padding:7px 28px;letter-spacing:2px}
#talk button small{color:var(--gold);font-weight:400}
/* 过场 */
#cut{background:radial-gradient(circle at 50% 30%,#23252e,#0e0f14 70%)}
#cut .card{background:transparent;color:var(--txt)}
#cut .card .wk{color:var(--gold);font-size:11px;letter-spacing:8px}
#cut .card h1{font-weight:300;letter-spacing:8px}
#cut .card .g{border-radius:999px;padding:8px 22px;font-weight:400;font-size:13px;letter-spacing:1px}
#cut .card .go{color:var(--sub)}
#cut .frame{border:1px solid rgba(255,255,255,.25);box-shadow:0 40px 100px rgba(0,0,0,.6)}
#cut .bar{background:var(--g2)}
#cut .bar .who{color:var(--gold);letter-spacing:4px;font-weight:500}
#cut .bar .line{font-weight:400}
#cut .frame .sprite{height:74%;bottom:26%}
.stamp{font-weight:500;letter-spacing:4px;font-size:16px;border-width:1px;border-radius:999px;padding:6px 18px;transform:none}
.stamp.ok{color:var(--gold);border-color:var(--gold);background:transparent}.stamp.ng{color:var(--warn);border-color:var(--warn);background:transparent}
@keyframes st{from{transform:scale(2.4);opacity:0}}
/* 人物融入 */
#cut .frame .sprite{filter:drop-shadow(0 18px 14px rgba(40,25,10,.3))}
#roomView .sprite.npc:hover{outline:none;-webkit-filter:brightness(1.08) drop-shadow(0 0 10px rgba(255,240,210,.85))!important;filter:brightness(1.08) drop-shadow(0 0 10px rgba(255,240,210,.85))!important}
/* 投影：人物剪影压扁翻转，沿光线方向斜铺在地面上 */
.cast{position:absolute;transform-origin:50% 100%;filter:brightness(0) blur(3px);opacity:.26;pointer-events:none;z-index:1;transition:left .7s ease-in-out}
/* 接触阴影：脚底一圈最深的暗部 */
.floorShadow{position:absolute;width:6%;height:2.6%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(rgba(25,15,8,.55),transparent 70%);z-index:1;transition:left .7s ease-in-out;pointer-events:none}
.gulls{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.gull{position:absolute;top:var(--y);left:-6%;width:calc(34px*var(--s));animation:glide var(--d) linear var(--dl) infinite;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
.gull path{animation:flap .5s ease-in-out infinite alternate;transform-origin:center}
@keyframes glide{0%{transform:translate(0,0)}50%{transform:translate(60vw,-12px)}100%{transform:translate(120vw,6px)}}
@keyframes flap{to{transform:scaleY(.4)}}
/* ================= 描边与质感：香槟金双线框 ================= */
:root{--gl:rgba(217,191,140,.62);--gl2:rgba(217,191,140,.24)}
#dash,#acts,#quest,#talk .box,#roomName,#prog,#cut .bar,#cut .card .g{background:linear-gradient(180deg,rgba(46,43,48,.86) 0%,rgba(18,18,24,.9) 55%,rgba(12,12,17,.92) 100%);border:1px solid var(--gl);box-shadow:inset 0 1px 0 rgba(255,236,200,.22),inset 0 -1px 0 rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.55),0 22px 48px rgba(0,0,0,.5)}
#dash::after,#acts::after,#quest::after,#talk .box::after{content:"";position:absolute;inset:4px;border:1px solid var(--gl2);border-radius:inherit;pointer-events:none}
#dash::before{content:"";position:absolute;left:50%;top:-6px;width:10px;height:10px;transform:translateX(-50%) rotate(45deg);background:linear-gradient(135deg,#f3dfb3,#b89a63);box-shadow:0 0 8px rgba(217,191,140,.7)}
#quest{position:absolute}
/* 房间：金色画框 */
#roomView{border:2px solid var(--gl);box-shadow:0 0 0 5px rgba(14,15,20,.75),0 0 0 6px var(--gl2),0 30px 80px rgba(0,0,0,.55)}
#roomView::after{content:"";position:absolute;inset:6px;border:1px solid rgba(255,236,200,.28);border-radius:20px;pointer-events:none;z-index:5}
#roomName{border-radius:10px;padding:7px 16px 7px 14px;font-size:13px}
.nametag{background:rgba(14,15,20,.82);border:1px solid var(--gl);color:#f5f3ef}
/* 仪表盘文字与分区 */
#dash{height:14%;padding:0 22px}
#dash .panel{border-left:1px solid var(--gl2)}
#wallet .m{font-size:22px;font-weight:400;color:#f7ecd5}
#wallet [data-st="gifts"]{font-size:12px!important;color:rgba(245,243,239,.72)!important}
#wallet .r{border-color:var(--gl);background:rgba(217,191,140,.1);font-size:11px}
.st{font-size:12px;color:rgba(245,243,239,.78);grid-template-columns:38px 1fr 30px}
.st b{font-size:13px;color:#fff}
.st .b{height:4px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.st .b i{background:linear-gradient(90deg,#b89a63,#f3dfb3)!important;box-shadow:0 0 6px rgba(217,191,140,.5)}
.al{width:36px;height:36px;border:1px solid var(--gl2);opacity:.55;color:#f3dfb3}
.al.on{border-color:#f0a3a3;color:#f0a3a3;opacity:1}
#rel .lb{font-size:12px}
#rel .head{border:1.5px solid var(--gl);box-shadow:0 0 0 2px rgba(14,15,20,.8)}
/* 活动栏：每个按钮独立成框，图标套金圈 */
#acts{padding:10px;gap:8px;bottom:-92px;border-radius:18px}
.act{min-width:92px;padding:10px 12px 9px;border:1px solid var(--gl2);border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015));gap:5px}
.act svg.i{width:18px;height:18px;padding:7px;box-sizing:content-box;border:1px solid var(--gl);border-radius:50%;color:#f3dfb3;background:radial-gradient(circle at 50% 30%,rgba(217,191,140,.22),rgba(217,191,140,.04))}
.act .an{font-size:13px;font-weight:600;color:#fff}
.act .ac{font-size:11px;color:rgba(245,243,239,.68)}
.act:hover:not(.off){border-color:var(--gl);background:linear-gradient(180deg,rgba(217,191,140,.16),rgba(217,191,140,.04));box-shadow:0 0 18px rgba(217,191,140,.25);transform:translateY(-3px)}
.act.off{opacity:.62}
.act.off svg.i{border-color:rgba(255,255,255,.18);color:rgba(255,255,255,.4);background:transparent}
.act.off .an{color:rgba(255,255,255,.55)}
.act.off .ac{color:#f0b8a0}
.act.exit{border:1px solid var(--gl2);border-radius:12px;margin-left:6px}
/* 地图地点牌 */
.spot .tag{background:rgba(14,15,20,.8);border:1px solid var(--gl);font-size:13px;box-shadow:0 0 0 3px rgba(14,15,20,.35),0 10px 24px rgba(0,0,0,.4)}
/* 过场：上方舞台 + 下方对白条，说话的人高亮 */
#cut .frame{width:78%;height:82%;display:flex;flex-direction:column;background:#0e0f14}
#cut .stagebox{position:relative;flex:1;overflow:hidden}
#cut .stagebox img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cut .stagebox .sprite{position:absolute;transform:translateX(-50%);transition:filter .3s,transform .3s}
#cut .stagebox .sprite.dim{filter:brightness(.55) saturate(.7)!important;transform:translateX(-50%) scale(.98)}
#cut .bar{position:relative;flex:none;min-height:0;display:flex;align-items:center;gap:18px;padding:18px 28px 20px;border-top:1px solid var(--gl)}
#cut .bar .face{flex:none;width:64px;height:64px;border-radius:50%;border:1.5px solid var(--gl);background:#2a2a30 center 5%/260% auto no-repeat;box-shadow:0 0 0 3px rgba(14,15,20,.8)}
#cut .bar .who{font-size:12px;letter-spacing:4px}
#cut .bar .line{font-size:18px;line-height:1.6;margin-top:4px}
#cut .bar .next{right:22px;bottom:10px}
/* 周结算卡 */
.res{display:flex;align-items:flex-end;gap:34px;margin-top:6px}
.res .rp{height:300px;filter:drop-shadow(0 20px 30px rgba(0,0,0,.6))}
.res .rr{min-width:340px;text-align:left;padding:20px 24px;border:1px solid var(--gl);border-radius:16px;background:linear-gradient(180deg,rgba(46,43,48,.7),rgba(14,15,20,.85));position:relative}
.res .rr::after{content:"";position:absolute;inset:4px;border:1px solid var(--gl2);border-radius:12px;pointer-events:none}
.res .stamp{margin-bottom:12px}
.rrow{display:grid;grid-template-columns:44px 1fr 74px;gap:10px;align-items:center;font-size:13px;margin:9px 0;color:rgba(245,243,239,.8)}
.rrow b{text-align:right;font-weight:500;font-variant-numeric:tabular-nums;color:#fff}
.rrow .rb{height:5px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
.rrow.hit .rb i{display:block;height:100%;background:linear-gradient(90deg,#b89a63,#f3dfb3)}
.rrow.miss .rb i{display:block;height:100%;background:linear-gradient(90deg,#a85a5a,#f0a3a3)}
.rrow.miss b{color:#f0a3a3}
.res .mono{margin:14px 0 0;font-size:14px;color:#f3dfb3;font-style:italic;letter-spacing:.5px}
.pops{color:var(--txt)!important;padding:3px 12px;border-radius:999px;background:rgba(14,15,20,.75);border:1px solid var(--hair);text-shadow:none;font-size:12px;font-weight:500;letter-spacing:.5px}

/* ================= 珍珠 · 腮红 · 玫瑰金 主题 ================= */
:root{--pearl:rgba(255,250,248,.95);--pearl2:rgba(252,240,240,.93);--rg:#c98b86;--rg2:rgba(201,139,134,.32);--plum:#4a2c3d;--plum2:#8a6476;--rose:#c76d84;--blush:#f6dfe1;--g1:#efb7c1;--g2:#c76d84;--btnInk:#fff;--gsoft:rgba(199,109,132,.14)}
html,body{font-family:"PingFang SC","SF Pro Display","Microsoft YaHei",sans-serif}
#stage{background:#f6e9e6}
#dash,#acts,#quest,#talk .box,#roomName,#prog,#cut .bar,#cut .card .g,.spot .tag,.nametag,.res .rr,#dists,#musicBtn{
  background:linear-gradient(180deg,var(--pb1) 0%,var(--pb2) 100%)!important;color:var(--ink)!important;
  border:1px solid var(--rg)!important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 #fff,0 0 0 3px rgba(255,255,255,.55),0 16px 40px rgba(120,60,80,.22)!important}
#dash::after,#acts::after,#quest::after,#talk .box::after,.res .rr::after{border-color:var(--rg2)!important}
#dash::before{background:linear-gradient(135deg,#f7d6d0,#c98b86)!important;box-shadow:0 0 8px rgba(201,139,134,.6)!important}
h1,h3,#quest h3,#cut .card h1,#roomName,.act .an,#talk .who,#cut .bar .who{font-family:"Songti SC","Noto Serif SC","STSong",serif!important}
/* 任务卡 */
#quest h4{color:var(--rose)!important}#quest h3{color:var(--ink)!important}
.q{color:var(--ink2)!important}.q .t span:last-child{color:var(--ink)!important}
.q .b{background:var(--gsoft)!important}.q .b i{background:linear-gradient(90deg,var(--g1),var(--g2))!important}
.q.ok{color:var(--rose)!important}.q.ok .b i{background:linear-gradient(90deg,#f2d3a8,#c9a06a)!important}
/* 仪表盘 */
#dash .panel{border-left:1px solid var(--rg2)!important;color:var(--ink)!important}
#dial .txt{color:var(--ink)!important}#dial .txt small{color:var(--ink2)!important}
#wallet .m{color:var(--ink)!important}#wallet [data-st="gifts"]{color:var(--ink2)!important}
#wallet .r{background:var(--gsoft)!important;color:var(--rose)!important;border:1px solid var(--rg2)!important;letter-spacing:3px}
.st{color:var(--ink2)!important}.st b{color:var(--ink)!important}
.st .b{background:var(--gsoft)!important}.st .b i{background:linear-gradient(90deg,var(--g1),var(--g2))!important;box-shadow:none!important}
.al{border:1px solid var(--rg2)!important;color:var(--rg)!important;background:var(--tile1)!important;opacity:.6}
.al.on{background:linear-gradient(90deg,var(--g1),var(--g2))!important;border-color:var(--g2)!important;color:var(--btnInk)!important;opacity:1}
#rel .head{border:1.5px solid var(--rg)!important;box-shadow:0 0 0 2px #fff!important}
#rel .track i{background:var(--gsoft)!important}#rel .track i.on{background:linear-gradient(90deg,var(--g1),var(--g2))!important;box-shadow:0 0 6px var(--g2)!important}
#rel .lb{color:var(--rose)!important}
/* 房间画框 */
#roomView{border:2px solid var(--rg)!important;box-shadow:0 0 0 5px rgba(255,250,248,.9),0 0 0 6px var(--rg2),0 30px 70px rgba(120,60,80,.3)!important}
#roomView::after{border-color:rgba(255,255,255,.45)!important}
#roomName span{color:var(--ink2)!important}
/* 活动栏：不透明，挡住画框线；每个按钮珍珠卡片 */
#acts{background:linear-gradient(180deg,var(--pb1),var(--pb2))!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;bottom:-96px!important}
.act{background:linear-gradient(180deg,var(--tile1),var(--tile2))!important;border:1px solid var(--rg2)!important;color:var(--ink)!important}
.act svg.i{color:var(--rose)!important;border:1px solid var(--rg)!important;background:radial-gradient(circle at 50% 30%,var(--tile1),var(--tileH))!important}
.act .an{color:var(--ink)!important}.act .ac{color:var(--ink2)!important}
.act:hover:not(.off){border-color:var(--rg)!important;background:linear-gradient(180deg,var(--tileH),var(--tile2))!important;box-shadow:0 6px 18px rgba(199,109,132,.25)!important}
.act.off{opacity:.55}.act.off svg.i{opacity:.5}
.act.off .an{color:var(--ink2)!important}.act.off .ac{color:#c76d84!important}
.act.exit svg.i{color:var(--ink)!important}
/* 投影：更短、更淡、更柔，不再像一条线 */
.cast{filter:brightness(0) blur(7px)!important;opacity:.14!important}
.floorShadow{background:radial-gradient(rgba(60,30,35,.4),transparent 70%)!important}
/* 对话框 */
#talk{background:rgba(74,44,61,.18)!important}
#talk .who{color:var(--rose)!important}#talk .line{color:var(--ink)!important}#talk .fx{color:#2f8a6a!important}
#talk .face{border:2px solid #fff!important;box-shadow:0 0 0 1px var(--rg),0 10px 24px rgba(120,60,80,.25)!important;background-color:#fbe9eb!important}
#talk button{background:var(--tile1)!important;border:1px solid var(--rg)!important;color:var(--ink)!important}
#talk button:hover{background:var(--tileH)!important}
#talk button.ok{background:linear-gradient(90deg,var(--g1),var(--g2))!important;color:var(--btnInk)!important;font-weight:700;border:0!important}
#talk button small{color:var(--rose)!important}
/* 过场与结算 */
#cut{background:radial-gradient(circle at 50% 25%,#fff6f4,#f6dfe1 45%,#e9c6cf 100%)!important}
#cut .card{color:var(--ink)!important}#cut .card .wk{color:var(--rose)!important}#cut .card .go{color:var(--ink2)!important}
#cut .frame{border:1px solid var(--rg)!important;box-shadow:0 0 0 6px rgba(255,255,255,.7),0 40px 90px rgba(120,60,80,.3)!important;background:#fff!important}
#cut .bar .line{color:var(--ink)!important}#cut .bar .who{color:var(--rose)!important}#cut .bar .face{border-color:var(--rg)!important;background-color:#fbe9eb!important;box-shadow:0 0 0 3px #fff!important}
.stamp.ok{color:#b5855a!important;border-color:#c9a06a!important}.stamp.ng{color:var(--rose)!important;border-color:var(--rose)!important}
.rrow{color:var(--ink2)!important}.rrow b{color:var(--ink)!important}.rrow .rb{background:rgba(199,109,132,.14)!important}
.rrow.hit .rb i{background:linear-gradient(90deg,#f2d3a8,#c9a06a)!important}.rrow.miss .rb i{background:linear-gradient(90deg,var(--g1),var(--g2))!important}.rrow.miss b{color:var(--rose)!important}
.res .mono{color:var(--rose)!important}
/* 地图标签 */
.spot .tag{font-family:"Songti SC","Noto Serif SC",serif;font-weight:600}
.spot .tag::before{background:var(--rose)!important;box-shadow:0 0 8px var(--g2)!important}
.spot:hover{box-shadow:0 0 0 2px #fff,0 0 50px rgba(255,220,225,.8)!important}
.pops{background:var(--pb1)!important;color:var(--ink)!important;border:1px solid var(--rg)!important}

/* ===== 可切换配色（data-theme 挂在 #stage 上） ===== */
#stage{--pb1:rgba(255,250,248,.95);--pb2:rgba(252,240,240,.93);--ink:#4a2c3d;--ink2:#8a6476;--tile1:#ffffff;--tile2:#fdf3f3;--tileH:#fbe4e8}
#stage[data-theme="rose"]{--pb1:rgba(120,34,58,.9);--pb2:rgba(68,16,34,.93);--ink:#fdeaf0;--ink2:rgba(253,234,240,.72);--rg:#d9b77e;--rg2:rgba(217,183,126,.35);--rose:#f1d39b;--g1:#f8e7c3;--g2:#c99a52;--btnInk:#3e0f20;--gsoft:rgba(241,211,155,.16);--tile1:rgba(255,255,255,.1);--tile2:rgba(255,255,255,.03);--tileH:rgba(241,211,155,.18)}
#stage[data-theme="blush"]{--pb1:rgba(255,222,232,.66);--pb2:rgba(240,168,196,.58);--ink:#5a1f3f;--ink2:#8c4766;--rg:rgba(255,255,255,.9);--rg2:rgba(255,255,255,.55);--rose:#cf3f73;--tile1:rgba(255,255,255,.55);--tile2:rgba(255,255,255,.25);--tileH:rgba(255,255,255,.75)}
#stage[data-theme="champagne"]{--pb1:rgba(247,236,220,.94);--pb2:rgba(225,203,176,.94);--ink:#4a3224;--ink2:#7d604e;--rg:#b8935f;--rg2:rgba(184,147,95,.35);--rose:#a9694f;--tile1:#fbf4ea;--tile2:#efe1cd;--tileH:#f6e6cf}
#stage[data-theme="blush"] #dash,#stage[data-theme="blush"] #acts,#stage[data-theme="blush"] #quest,#stage[data-theme="blush"] #talk .box{-webkit-backdrop-filter:blur(22px) saturate(1.4)!important;backdrop-filter:blur(22px) saturate(1.4)!important}
/* 区域切换、音乐按钮 */
#themeBtn{position:absolute;right:calc(1.6% + 50px);top:2.4%;z-index:6;height:42px;padding:0 14px;border-radius:999px;cursor:pointer;font:600 12px "Songti SC",serif;letter-spacing:1px;background:linear-gradient(180deg,var(--pb1),var(--pb2));color:var(--ink);border:1px solid var(--rg)}
#dists{position:absolute;left:1.6%;top:2.4%;z-index:6;display:flex;gap:4px;padding:5px;border-radius:999px}
#dists button{border:0;background:transparent;padding:7px 16px;border-radius:999px;font:600 13px "Songti SC","Noto Serif SC",serif;color:var(--plum2);cursor:pointer;letter-spacing:1px}
#dists button.on{background:linear-gradient(90deg,var(--g1),var(--g2));color:var(--btnInk);font-weight:700}
.inroom #dists{display:none}
#musicBtn{position:absolute;right:1.6%;top:2.4%;z-index:6;width:42px;height:42px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--rose)!important}
#musicBtn svg.i{width:18px;height:18px}#musicBtn.off{color:#b8a3ad!important}

/* 任务卡：压成一条横向胶囊，少挡地图 */
#quest{width:auto!important;display:flex!important;align-items:center;gap:16px;padding:8px 20px!important;border-radius:999px!important;top:2%!important}
#quest::after{border-radius:999px!important}
#quest h3{margin:0!important;font-size:14px!important;white-space:nowrap}
#quest .q{margin:0!important;min-width:96px;font-size:11px!important}
#quest .q .b{margin-top:3px}
.inroom #quest{display:none!important}

/* 活动栏压在房间画框之上，并完全不透明，不再透出画框的线 */
#acts{z-index:12!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
#stage{--base:#fbeeee}#stage[data-theme="rose"]{--base:#4a1426}#stage[data-theme="blush"]{--base:#eab9c9}#stage[data-theme="champagne"]{--base:#e8d8c0}
#acts{background:linear-gradient(180deg,var(--pb1),var(--pb2)),var(--base)!important}
.act{background:linear-gradient(180deg,var(--tile1),var(--tile2)),var(--base)!important}
#roomView::after{z-index:3!important}
/* 未开放 / 暂不可用：明确置灰 */
.act.off{opacity:1!important;filter:grayscale(1) brightness(.72) contrast(.9)!important;cursor:not-allowed}
.act.off .ac{color:#ffd0da!important;font-weight:600}
.spot.closed{background:rgba(30,22,28,.38);-webkit-backdrop-filter:grayscale(1) brightness(.75);backdrop-filter:grayscale(1) brightness(.75);border-radius:16px;cursor:not-allowed}
.spot.closed .tag{background:rgba(70,62,66,.92)!important;color:#e6e0e2!important;border-color:#9a9094!important}
.spot.closed .tag::before{background:#9a9094!important;box-shadow:none!important}

/* 道具动画 */
.prop{position:absolute;z-index:4;font-size:52px;line-height:1;transform:translateX(-50%);filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));pointer-events:none}
.prop.a-sweep{transform-origin:50% 10%;animation:psweep .45s ease-in-out infinite alternate}
@keyframes psweep{from{transform:translateX(-95%) rotate(-28deg)}to{transform:translateX(-5%) rotate(28deg)}}
.prop.a-steam{animation:psteam 1s ease-out infinite}
@keyframes psteam{0%{transform:translate(-50%,6px) scale(.9);opacity:.5}50%{opacity:1}100%{transform:translate(-50%,-26px) scale(1.08);opacity:.4}}
.prop.a-bob{animation:pbob .5s ease-in-out infinite alternate}@keyframes pbob{to{transform:translate(-50%,-12px)}}
.prop.a-spin{animation:pspin .8s linear infinite}@keyframes pspin{to{transform:translateX(-50%) rotate(360deg)}}
.prop.a-float{animation:pfloat 1.4s ease-in-out infinite}@keyframes pfloat{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-18px)}}
.prop.a-bite{animation:pbite .45s ease-in-out infinite}@keyframes pbite{50%{transform:translateX(-50%) scale(.8)}}
.prop.a-shake{animation:pshake .16s linear infinite alternate}@keyframes pshake{from{transform:translateX(-50%) rotate(-18deg)}to{transform:translateX(-50%) rotate(18deg)}}
.prop.a-swing{transform-origin:50% 100%;animation:pswing 1.3s ease-in-out infinite}@keyframes pswing{0%{transform:translateX(-50%) rotate(-60deg)}60%{transform:translateX(-50%) rotate(70deg)}100%{transform:translateX(-50%) rotate(-60deg)}}
.prop.a-zoom{animation:pzoom .7s ease-in-out infinite alternate}@keyframes pzoom{from{transform:translateX(-120%)}to{transform:translateX(30%)}}
.prop.a-bounce{animation:pbounce .4s ease-in-out infinite alternate}@keyframes pbounce{to{transform:translate(-50%,-22px) scale(1.12)}}
#su.act-sweep{animation:ssweep .45s ease-in-out infinite alternate!important}@keyframes ssweep{from{transform:translateX(-53%) rotate(-2.5deg)}to{transform:translateX(-47%) rotate(2.5deg)}}
#su.act-shake,#su.act-bounce{animation:sbounce .35s ease-in-out infinite alternate!important}@keyframes sbounce{to{transform:translateX(-50%) translateY(-2%)}}
#su.act-swing{animation:sswing 1.3s ease-in-out infinite!important}@keyframes sswing{50%{transform:translateX(-50%) rotate(-3deg)}}
/* 顶部时钟 + 下一项 */
#clockTop{position:absolute;left:50%;top:1.2%;transform:translateX(-50%);z-index:14;display:flex;align-items:center;gap:12px;padding:6px 8px 6px 18px;border-radius:999px;white-space:nowrap;
  background:linear-gradient(180deg,var(--pb1),var(--pb2)),var(--base);border:1px solid var(--rg);color:var(--ink);box-shadow:0 0 0 3px rgba(255,255,255,.25),0 12px 30px rgba(60,20,30,.3);font-size:13px}
#clockTop .ct-t b{font-size:18px;letter-spacing:1px;margin:0 2px;font-variant-numeric:tabular-nums}
#clockTop .ct-n{color:var(--ink2);border-left:1px solid var(--rg2);padding-left:12px;max-width:430px;overflow:hidden;text-overflow:ellipsis}
#clockTop .ct-n.hot{color:var(--rose);font-weight:700;animation:hotb 1s ease-in-out infinite alternate}@keyframes hotb{to{opacity:.55}}
#clockTop .ct-go{border:0;border-radius:999px;padding:6px 14px;background:linear-gradient(90deg,var(--g1),var(--g2));color:var(--btnInk);font-weight:700;cursor:pointer}
#clockTop:not(:has(.ct-go)){padding-right:18px}
#quest{top:8.5%!important}
#room{top:8%!important;height:57%!important}
/* 地图上的约会图钉 */

/* ---------- 音乐：每类场所一首原创曲，Web Audio 实时合成（电钢琴 / 弦乐垫 / 颤音琴 / 贝斯 / 刷鼓 + 混响），切换场所时淡入淡出 ---------- */
const AU={ctx:null,on:true,master:null,bus:null,sfxBus:null,timer:null,step:0,next:0,song:null,want:'theme',sw:null};
try{if(localStorage.getItem('haomen-music')==='off')AU.on=false}catch(e){}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function auInit(){
  if(AU.ctx)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const c=AU.ctx=new C();
  AU.master=c.createGain();AU.master.gain.value=AU.on?.55:0;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=3;AU.master.connect(comp);comp.connect(c.destination);
  const len=Math.floor(c.sampleRate*2.8),ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)}
  const rv=c.createConvolver();rv.buffer=ir;const rvg=c.createGain();rvg.gain.value=.32;rv.connect(rvg);rvg.connect(AU.master);
  AU.bus=c.createGain();AU.bus.gain.value=.0001;
  const tone=c.createBiquadFilter();tone.type='lowpass';tone.frequency.value=8500;AU.bus.connect(tone);tone.connect(AU.master);tone.connect(rv);
  AU.sfxBus=c.createGain();AU.sfxBus.gain.value=.6;AU.sfxBus.connect(AU.master);AU.sfxBus.connect(rv);
  const nl=Math.floor(c.sampleRate*.5),nb=c.createBuffer(1,nl,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nl;i++)nd[i]=Math.random()*2-1;AU.noise=nb;
}
/* ---- 乐器 ---- */
function ep(t,m,dur,vol){const c=AU.ctx,f=mtof(m),car=c.createOscillator(),mod=c.createOscillator(),mg=c.createGain(),g=c.createGain();
  car.frequency.value=f;mod.frequency.value=f;mg.gain.setValueAtTime(f*1.1,t);mg.gain.exponentialRampToValueAtTime(f*.04,t+.9);
  mod.connect(mg);mg.connect(car.frequency);car.connect(g);g.connect(AU.bus);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.006);g.gain.setTargetAtTime(vol*.45,t+.05,.4);g.gain.setTargetAtTime(.0001,t+dur,.25);
  car.start(t);mod.start(t);car.stop(t+dur+1.6);mod.stop(t+dur+1.6)}
function vib(t,m,dur,vol){const c=AU.ctx,f=mtof(m),o=c.createOscillator(),o2=c.createOscillator(),h=c.createGain(),g=c.createGain(),tr=c.createOscillator(),tg=c.createGain();
  o.frequency.value=f;o2.frequency.value=f*4.01;h.gain.value=.1;o2.connect(h);h.connect(g);o.connect(g);
  tr.frequency.value=5;tg.gain.value=vol*.2;tr.connect(tg);tg.connect(g.gain);g.connect(AU.bus);

  const best=Object.entries(ITEMS).filter(([id,it])=>cats.includes(it.tab||it.c)&&it.p>0&&!owned(id)&&it.p<=S.money&&it.st>0).sort((a,b)=>b[1].st/b[1].p-a[1].st/a[1].p)[0];
  S.talked=S.talked||{};const done=S.talked['guide'+name]===S.day;
  const i=await talk(who,`${name}：「${done?'今天想再看看什么？':'欢迎光临～今天想找点什么？'}」`,[['推荐一件最适合约会的',best?`她会推荐：${best[1].n}`:'你的预算暂时不够'],['请她帮你搭配',done?'今天聊过了':'魅力+2'],['打听哪家太太来过',done?'今天聊过了':'名望+1']]);
  if(i===0){await talk(who,best?`${name}：「${best[1].n}，¥${best[1].p}，穿搭分 +${best[1].st}。性价比最高，约会穿它，男人眼睛会直。」`:`${name}：「先攒攒钱，下周来看新款。」`);return}
  if(done){await talk(who,`${name}：「今天的搭配建议都给你啦，明天再来～」`);return}
  const b={...S};if(i===1)add('charm',2);else add('fame',1);S.talked['guide'+name]=S.day;S.t+=.5;renderAll();pops(b);save();
  await talk(who,i===1?`${name}：「腰线提高两厘米，耳环换成小一号的——你看，贵气就出来了。」`:`${name}：「昨天陈太太来过，买了三只包。她说下周的慈善晚宴，靳夫人也会去哦。」`,null,diffText(b))}
async function buyItem(id){const it=ITEMS[id];if(S.money<it.p){toast('钱不够');return}
  const b={...S};add('money',-it.p);S.owned=S.owned||[];S.wear=S.wear||{};
  if(it.c==='makeup'){S.makeup=(S.makeup||0)+it.qty}else{S.owned.push(id);if(it.c!=='gear')S.wear[it.c]=id;add('mood',5);if(it.c==='car'){add('fame',it.fb);add('charm',it.cb)}}
  actSound('register',.9);renderAll();pops(b);save();toast(it.c==='car'?`买下${it.n}！${carMatch()?'和你的身份很配，穿搭分额外 +3':'先开着，等身份配得上更好的车'}`:it.c==='makeup'?`买了${it.n}，美妆 +${it.qty}`:it.c==='gear'?`买下${it.n}：${it.desc}`:`买下${it.n}，已经穿戴上`);setOutfit()}
function itemPic(id,it){return it.c==='outfit'?`<div class="pic fig"><img src="${id==='tweed'?'assets/sutang.png':'assets/su_'+id+'.png'}" onerror="this.parentNode.style.background='${it.col}';this.remove()"></div>`:`<div class="pic" style="background:${it.col}"><img src="assets/item_${id}.png" onerror="this.remove()"></div>`}
function openWardrobe(cur){
  cur=cur||'outfit';const slots=['outfit','watch','jewel','bag','car'];
  const mine=Object.entries(ITEMS).filter(([id,it])=>it.c===cur&&(it.p===0||owned(id)));
  const tiles=mine.length?mine.map(([id,it])=>{const on=S.wear&&S.wear[cur]===id;return `<div class="si wtile${on?' on':''}" data-wear="${cur}:${on&&cur!=='outfit'&&cur!=='car'?'':id}">${itemPic(id,it)}<b>${it.n}</b><span>${on?(cur==='outfit'||cur==='car'?'正在穿着':'已戴上 · 再点摘下'):it.st?'穿搭分 +'+it.st:'基础款'}</span></div>`}).join(''):`<div class="wempty">还没有${CATS[cur]}。去${cur==='car'?'卡丁车场隔壁的 4S 店':'海港名店城的精品店'}看看吧。</div>`;
  $('#plan').innerHTML=`<div class="pbox shop wardrobe"><button class="px">×</button><h3>我的衣柜</h3><div class="wlay"><div class="wme"><img src="${IMG.su}"><p>穿搭分 <b>${styleScore()}</b><br><small>身份「${rank(S)}」${S.wear&&S.wear.car?(carMatch()?' · 座驾匹配 +3':' · 座驾低于身份'):''}<br>约会时算进魅力 · 美妆 ${S.makeup||0} 份</small></p></div><div class="wright"><div class="tabs">${slots.map(c=>`<button data-cat="${c}" class="${c===cur?'on':''}">${CATS[c]}</button>`).join('')}</div><div class="sgrid">${tiles}</div></div></div></div>`;
  $('#plan .px').onclick=()=>$('#plan').classList.remove('show');
  $('#plan').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>openWardrobe(b.dataset.cat));
  $('#plan').querySelectorAll('[data-wear]').forEach(b=>b.onclick=()=>{const [k,id]=b.dataset.wear.split(':');S.wear=S.wear||{};S.wear[k]=id||null;save();setOutfit();renderAll();openWardrobe(k)});
  $('#plan').classList.add('show');
}

function actSound(k,dur){if(!AU.ctx||!AU.on||!k)return;const c=AU.ctx,t=c.currentTime,end=t+dur,out=c.createGain();
 out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(1,t+.15);out.gain.setValueAtTime(1,Math.max(t+.2,end-.25));out.gain.linearRampToValueAtTime(0,end);out.connect(AU.sfxBus);
 const N=()=>{const n=c.createBufferSource();n.buffer=AU.noise;n.loop=true;n.start(t);n.stop(end+.1);return n};
 const F=(ty,f,q)=>{const x=c.createBiquadFilter();x.type=ty;x.frequency.value=f;if(q)x.Q.value=q;return x};
 const G=v=>{const g=c.createGain();g.gain.value=v;return g};
 const L=(rate,depth,param)=>{const o=c.createOscillator(),g=G(depth);o.frequency.value=rate;o.connect(g);g.connect(param);o.start(t);o.stop(end+.1)};
 const chain=(...xs)=>{for(let i=0;i<xs.length-1;i++)xs[i].connect(xs[i+1])};
 switch(k){
  case 'vacuum':{const n=N(),f=F('bandpass',900,.8),g=G(.2);chain(n,f,g,out);const o=c.createOscillator();o.type='sawtooth';o.frequency.value=150;const of=F('lowpass',500),og=G(.035);chain(o,of,og,out);o.start(t);o.stop(end+.1);L(.6,260,f.frequency);break}
  case 'water':{const n=N(),f=F('bandpass',1400,1.5),g=G(.14);chain(n,f,g,out);L(3,600,f.frequency);break}
  case 'oven':{const n=N(),f=F('highpass',3500),g=G(.05);chain(n,f,g,out);L(11,.04,g.gain);break}
  case 'espresso':case 'steam':{const n=N(),f=F('highpass',2500),g=G(.08);chain(n,f,g,out);L(.5,.05,g.gain);break}
  case 'grind':{const n=N(),f=F('bandpass',2200,2),g=G(.12);chain(n,f,g,out);L(18,.08,g.gain);break}
  case 'engine':{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=72;const f=F('lowpass',700),g=G(.09);chain(o,f,g,out);o.start(t);o.stop(end+.1);L(.45,38,o.frequency);break}
  case 'register':{const keep=AU.bus;AU.bus=out;brush(t+.02,.05,.5);vib(t+.12,100,.5,.12);vib(t+.12,107,.5,.08);brush(t+.35,.12,.35);AU.bus=keep;break}
  case 'coins':{const keep=AU.bus;AU.bus=out;for(let i=0;i<5;i++)vib(t+.05+i*.07+Math.random()*.03,98+((i*5)%9),.12,.07);AU.bus=keep;break}
  case 'dishes':{const keep=AU.bus;AU.bus=out;for(let x=t+.1,i=0;x<end-.1;x+=.38+Math.random()*.3,i++){vib(x,93+(i*7)%11,.08,.06);if(i%3===0)brush(x+.05,.04,.2)}AU.bus=keep;break}
  case 'cheer':{const n=N(),f=F('bandpass',1200,.6),g=G(.1);chain(n,f,g,out);L(1.3,.05,g.gain);break}
  default:{const keep=AU.bus;AU.bus=out;const step={crunch:.45,clink:.9,pour:.3,piano:.3,paper:.45,cart:.55,swing:1.3,shaker:.16,wipe:.45,blend:.12,spray:.8}[k]||.6;let i=0;
   for(let x=t+.1;x<end-.1;x+=step,i++){
    if(k==='piano')ep(x,60+[0,4,7,12,7,4,2,5][i%8],.3,.06);
    else if(k==='clink')vib(x,95+(i%3),.05,.05);
    else if(k==='swing'){brush(x,.14,.25);vib(x+.25,84,.02,.04)}
    else if(k==='pour')brush(x,.05,.25);
    else brush(x,k==='crunch'?.12:.06,k==='crunch'?.06:.12);
   }AU.bus=keep}
 }}
